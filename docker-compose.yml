services:
  postgres:
    image: postgres:15-alpine
    container_name: travelguard_db
    environment:
      POSTGRES_USER: travelguard
      POSTGRES_PASSWORD: travelguard_secret
      POSTGRES_DB: travelguard_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelguard -d travelguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
